name = "skteam-panel"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Static frontend served from ./public
[assets]
directory = "./public"
binding = "ASSETS"
# API routes must hit the Worker first, everything else is static
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Non-secret config. Secrets are set with `wrangler secret put <NAME>`:
#   ADMIN_TOKEN, TURSO_AUTH_TOKEN, SUPABASE_SERVICE_KEY
[vars]
TURSO_DATABASE_URL = "libsql://YOUR-DB-YOUR-ORG.turso.io"
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
